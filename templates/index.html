<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previus OS - Premium</title>
    <link rel="stylesheet" href="/static/style.css">
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>
    <div id="login-view" class="view active">
        <div class="login-card">
            <h1>PREVIUS OS</h1>
            <input type="password" id="tokenInput" placeholder="Token Deriv API">
            <button onclick="connectToServer()">ACESSAR TERMINAL</button>
            <p id="status-msg"></p>
        </div>
    </div>

    <div id="dashboard-view" class="view">
        <header>
            <button class="menu-btn" onclick="toggleMenu()">☰</button>
            <div class="logo">PREVIUS OS</div>
            <div class="account-info">
                <span id="balance-display">$0.00</span>
                <span id="type-display" class="badge">DEMO</span>
            </div>
        </header>

        <nav id="sidebar">
            <div class="sidebar-header"><button onclick="toggleMenu()">✕</button></div>
            <ul>
                <li onclick="showScreen('manual')">🎯 Operação Manual</li>
                <li onclick="showScreen('auto')">🤖 Operação Automática</li>
                <li onclick="location.reload()" style="color:red">Sair</li>
            </ul>
        </nav>

        <div class="main-content">
            <div class="analysis-control">
                <button id="btnAnalysis" class="btn-main" onclick="toggleAnalysis()">INICIAR ANÁLISE</button>
                <div id="analysis-results" class="results-box hidden">
                    <span id="resAction">---</span> | <span id="resProb">0%</span>
                    <button id="btnOffBot" class="btn-small" onclick="toggleAnalysis()">DESLIGAR BOT</button>
                </div>
            </div>

            <div id="chart-container"></div>

            <div id="screen-manual" class="app-screen hidden">
                <h3>OPERAÇÃO MANUAL</h3>
                <div class="form-group">
                    <label>Valor (USD)</label>
                    <input type="number" id="mAmount" value="10">
                </div>
                <div class="row">
                    <div class="form-group"><label>Take Profit</label><input type="number" id="mTP" value="5"></div>
                    <div class="form-group"><label>Stop Loss</label><input type="number" id="mSL" value="5"></div>
                </div>
                <div class="row">
                    <button class="btn-buy" onclick="manualTrade('CALL')">COMPRA</button>
                    <button class="btn-sell" onclick="manualTrade('PUT')">VENDA</button>
                </div>
                <div id="trade-status">Status: Pronto</div>
            </div>

            <div id="screen-auto" class="app-screen hidden">
                <h3>OPERAÇÃO AUTOMÁTICA</h3>
                <div class="form-group">
                    <label>Entrada (USD)</label>
                    <input type="number" id="aAmount" value="1">
                </div>
                <button id="btnAuto" class="btn-auto" onclick="toggleAutoBot()">INICIAR OPERAÇÃO AUTOMÁTICA</button>
                <div class="stats-grid">
                    <div class="stat">Lucro: <span id="aProfit">$0.00</span></div>
                    <div class="stat">Ordens: <span id="aCount">0</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let analysisActive = false;
        let autoActive = false;

        function toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); }

        function showScreen(type) {
            document.querySelectorAll('.app-screen').forEach(s => s.classList.add('hidden'));
            document.getElementById('screen-' + type).classList.remove('hidden');
            toggleMenu();
        }

        function toggleAnalysis() {
            analysisActive = !analysisActive;
            const btn = document.getElementById('btnAnalysis');
            const res = document.getElementById('analysis-results');
            if(analysisActive) {
                btn.innerText = "PARAR ANÁLISE";
                res.classList.remove('hidden');
                startAnalysisLoop();
            } else {
                btn.innerText = "INICIAR ANÁLISE";
                res.classList.add('hidden');
            }
        }

        async function manualTrade(side) {
            const amount = document.getElementById('mAmount').value;
            const status = document.getElementById('trade-status');
            status.innerText = "Enviando ordem...";
            const res = await fetch('/execute_manual', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({action: side, amount: parseFloat(amount), symbol: "R_100"})
            });
            const data = await res.json();
            status.innerText = data.message;
        }

        function toggleAutoBot() {
            autoActive = !autoActive;
            const btn = document.getElementById('btnAuto');
            btn.innerText = autoActive ? "DESLIGAR OPERAÇÃO AUTOMÁTICA" : "INICIAR OPERAÇÃO AUTOMÁTICA";
            btn.style.background = autoActive ? "red" : "var(--accent)";
        }

        // TradingView Loader Integrado
        new TradingView.widget({
            "autosize": true,
            "symbol": "DERIV:100S",
            "interval": "1",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "container_id": "chart-container"
        });

        async function connectToServer() {
            const token = document.getElementById('tokenInput').value;
            const res = await fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({token: token})
            });
            const data = await res.json();
            if(data.status === 'success') {
                document.getElementById('login-view').classList.remove('active');
                document.getElementById('dashboard-view').classList.add('active');
                setInterval(updateAccount, 3000);
            }
        }

        async function updateAccount() {
            const res = await fetch('/account_info');
            const data = await res.json();
            document.getElementById('balance-display').innerText = "$" + data.balance.toFixed(2);
        }
    </script>
</body>
</html>
