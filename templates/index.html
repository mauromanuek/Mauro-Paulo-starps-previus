<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previus-Starps OS</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>
    <div id="login-view" class="view active">
        <div class="login-card">
            <h1 style="color:#ff4400">PREVIUS-STARPS</h1>
            <p>Insira o seu Token API da Deriv</p>
            <input type="password" id="tokenInput" placeholder="Token aqui...">
            <button onclick="connectToServer()">CONECTAR SISTEMA</button>
            <p id="status-msg" style="margin-top:10px; font-size:12px; color:#888"></p>
        </div>
    </div>

    <div id="dashboard-view" class="view">
        <header>
            <div class="header-left">
                <button class="menu-btn" onclick="toggleMenu()">☰</button>
                <span class="logo">STARPS OS</span>
            </div>
            <div class="header-right">
                <span id="balance-display">$0.00</span>
                <span id="type-display" class="badge">DEMO</span>
            </div>
        </header>

        <div class="main-layout">
            <nav id="sidebar">
                <ul>
                    <li class="active">Análise em Tempo Real</li>
                    <li>Histórico de Sinais</li>
                    <li>Gestão de Risco</li>
                </ul>
            </nav>

            <section class="content">
                <div class="analysis-panel">
                    <div class="signal-info">
                        <h3>DIREÇÃO IA: <span id="iaAction">ANALISANDO...</span></h3>
                        <p id="iaReason">A aguardar fluxo de ticks do mercado...</p>
                    </div>
                    <div class="signal-prob">
                        <h2 id="iaProb">--%</h2>
                        <span>Probabilidade</span>
                    </div>
                </div>

                <div id="chart-container"></div>
            </section>
        </div>
    </div>

    <script>
        function toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); }

        async function connectToServer() {
            const token = document.getElementById('tokenInput').value;
            const status = document.getElementById('status-msg');
            if(!token) return status.innerText = "Insira um token!";

            status.innerText = "A validar token na Deriv...";
            
            const res = await fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({token: token})
            });
            const data = await res.json();

            if(data.status === 'success') {
                document.getElementById('login-view').classList.remove('active');
                document.getElementById('dashboard-view').classList.add('active');
                loadChart();
                startLiveData();
            } else {
                status.innerText = data.message;
            }
        }

        function loadChart() {
            new TradingView.widget({
                "autosize": true, "symbol": "DERIV:VOL100", "interval": "1",
                "timezone": "Etc/UTC", "theme": "dark", "style": "1",
                "container_id": "chart-container"
            });
        }

        function startLiveData() {
            // Atualiza Saldo
            setInterval(async () => {
                const res = await fetch('/account_info');
                const data = await res.json();
                document.getElementById('balance-display').innerText = "$" + data.balance.toFixed(2);
                document.getElementById('type-display').innerText = data.account_type.toUpperCase();
            }, 4000);

            // Atualiza Sinais
            setInterval(async () => {
                const res = await fetch('/get_analysis');
                const data = await res.json();
                if(data.status === 'active') {
                    document.getElementById('iaAction').innerText = data.action;
                    document.getElementById('iaProb').innerText = (data.probability * 100).toFixed(0) + "%";
                    document.getElementById('iaReason').innerText = data.reason;
                    document.getElementById('iaAction').style.color = data.action.includes("CALL") ? "#00ff88" : "#ff3344";
                }
            }, 2000);
        }
    </script>
</body>
</html>
