<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previus-Starps OS</title>
    <link rel="stylesheet" href="/static/style.css">
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>
    <div id="login-view" class="view active">
        <div class="login-card">
            <h1 style="color:#ff4400">PREVIUS-STARPS</h1>
            <input type="password" id="tokenInput" placeholder="Insira seu Token API">
            <button onclick="connect()">CONECTAR</button>
            <p id="status-msg"></p>
        </div>
    </div>

    <div id="dashboard-view" class="view">
        <header>
            <div class="header-left">
                <button class="menu-toggle" onclick="toggleMenu()">☰ MENU</button>
            </div>
            <div class="header-right">
                <span id="balance">$0.00</span>
                <span id="acc-type" class="badge">DEMO</span>
            </div>
        </header>

        <div class="main-wrapper">
            <nav id="sidebar">
                <div class="nav-section">TEMPOS GRÁFICOS</div>
                <ul>
                    <li onclick="updateInterval('1')">M1 - 1 MINUTO</li>
                    <li onclick="updateInterval('5')">M5 - 5 MINUTOS</li>
                    <li onclick="updateInterval('15')">M15 - 15 MINUTOS</li>
                    <li onclick="updateInterval('60')">H1 - 1 HORA</li>
                </ul>
                <div class="nav-section">SISTEMA</div>
                <ul>
                    <li onclick="location.reload()">SAIR</li>
                </ul>
            </nav>

            <main class="trading-area">
                <div class="ia-status-bar">
                    <div class="stat">IA: <span id="iaAction">ANALISANDO</span></div>
                    <div class="stat">PROB: <span id="iaProb">--%</span></div>
                    <div class="stat">REF: <span id="iaReason">Sincronizando...</span></div>
                </div>
                <div id="chart-widget-container"></div>
            </main>
        </div>
    </div>

    <script>
        function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); }

        async function connect() {
            const token = document.getElementById('tokenInput').value;
            const msg = document.getElementById('status-msg');
            msg.innerText = "Conectando ao APP 114910...";

            const res = await fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({token: token})
            });
            const data = await res.json();

            if(data.status === 'success') {
                document.getElementById('login-view').classList.remove('active');
                document.getElementById('dashboard-view').classList.add('active');
                loadTradingView("1");
                startDataLoop();
            } else {
                msg.innerText = "Token Inválido ou Erro de Conexão.";
            }
        }

        function loadTradingView(interval) {
            new TradingView.widget({
                "autosize": true,
                "symbol": "DERIV:VOL100",
                "interval": interval,
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "br",
                "container_id": "chart-widget-container",
                "allow_symbol_change": true
            });
        }

        function updateInterval(t) {
            loadTradingView(t);
            toggleMenu();
        }

        function startDataLoop() {
            setInterval(async () => {
                const r = await fetch('/account_info');
                const d = await r.json();
                document.getElementById('balance').innerText = "$" + d.balance.toFixed(2);
                document.getElementById('acc-type').innerText = d.account_type.toUpperCase();
            }, 3000);

            setInterval(async () => {
                const r = await fetch('/get_analysis');
                const d = await r.json();
                if(d.status === 'active') {
                    document.getElementById('iaAction').innerText = d.action;
                    document.getElementById('iaProb').innerText = (d.probability * 100).toFixed(0) + "%";
                    document.getElementById('iaReason').innerText = d.reason;
                    document.getElementById('iaAction').style.color = d.action.includes("CALL") ? "#00ff88" : "#ff3344";
                }
            }, 2000);
        }
    </script>
</body>
</html>
