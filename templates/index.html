<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Previus-Starps OS</title>
    <link rel="stylesheet" href="/static/style.css">
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body onclick="closeMenuOnClickOutside(event)">
    <div id="login-view" class="view active">
        <div class="login-card">
            <h1 style="color:#ff4400; margin-bottom: 5px;">PREVIUS-STARPS</h1>
            <p style="font-size: 12px; color: #888; margin-bottom: 25px;">SISTEMA INTELIGENTE DE TRADING</p>
            <input type="password" id="tokenInput" placeholder="Insira seu Token API Deriv">
            <button onclick="connectToServer()">ACESSAR TERMINAL</button>
            <p id="status-msg" style="font-size: 12px; margin-top: 15px;"></p>
        </div>
    </div>

    <div id="dashboard-view" class="view">
        <header>
            <button class="menu-btn" onclick="toggleMenu(event)">☰</button>
            <div style="font-weight: 800; color: var(--accent); font-size: 14px;">PREVIUS OS</div>
            <div class="info-bar">
                <span id="balance-display">$0.00</span>
                <span id="type-display" class="badge">DEMO</span>
            </div>
        </header>

        <div class="main-layout">
            <nav id="sidebar" onclick="event.stopPropagation()">
                <div style="padding: 20px; text-align: right;"><button onclick="toggleMenu(event)" style="background:none; color:white; width: auto;">✕</button></div>
                <ul>
                    <li onclick="switchTab('manual')">🎯 Operação Manual</li>
                    <li onclick="switchTab('auto')">🤖 Operação Automática</li>
                    <hr style="border: 0; border-top: 1px solid #222;">
                    <li onclick="location.reload()" style="color: #ff3344;">Sair / Logout</li>
                </ul>
            </nav>

            <main class="content-area">
                <div class="analysis-control-bar">
                    <div id="analysis-off">
                        <button class="btn-start" onclick="toggleAnalysis(true)">▶ INICIAR ANÁLISE</button>
                    </div>
                    <div id="analysis-on" style="display: none;">
                        <div class="analysis-display">
                            <div class="analysis-info">
                                <span id="iaAction">ANALISANDO...</span>
                                <small id="iaReason">Aguardando dados do TradingView...</small>
                            </div>
                            <div class="analysis-prob" id="iaProb">--%</div>
                        </div>
                        <button class="btn-stop" onclick="toggleAnalysis(false)">■ DESLIGAR BOT</button>
                    </div>
                </div>

                <section id="chart-container"></section>
            </main>

            <aside class="interface-panel" id="panel-manual">
                <div class="panel-header">
                    <h4>OPERAÇÃO MANUAL</h4>
                    <button onclick="closeAllPanels()" class="close-panel">✕</button>
                </div>
                <div class="recommendation-box">
                    <div id="iaActionManual">AGUARDANDO ANÁLISE...</div>
                    <div id="iaProbManual">Probabilidade: --%</div>
                </div>
                <div class="panel-row">
                    <div class="panel-group">
                        <label>VALOR (USD)</label>
                        <input type="number" id="manualAmount" value="10">
                    </div>
                </div>
                <div class="panel-row">
                    <div class="panel-group"><label>TAKE PROFIT</label><input type="number" id="manualTP" value="5"></div>
                    <div class="panel-group"><label>STOP LOSS</label><input type="number" id="manualSL" value="5"></div>
                </div>
                <div class="panel-row">
                    <button class="btn-buy" style="flex:1">COMPRA (CALL)</button>
                    <button class="btn-sell" style="flex:1">VENDA (PUT)</button>
                </div>
            </aside>

            <aside class="interface-panel" id="panel-auto">
                <div class="panel-header">
                    <h4>BOT AUTOMÁTICO</h4>
                    <button onclick="closeAllPanels()" class="close-panel">✕</button>
                </div>
                <div class="panel-row">
                    <div class="panel-group">
                        <label>ENTRADA (USD)</label>
                        <input type="number" id="autoAmount" value="1.00">
                    </div>
                </div>
                <div class="panel-row">
                    <div class="panel-group"><label>TAKE PROFIT</label><input type="number" id="autoTP" value="10.00"></div>
                    <div class="panel-group"><label>STOP LOSS</label><input type="number" id="autoSL" value="5.00"></div>
                </div>
                <button class="btn-auto" id="btnStartAuto" onclick="toggleBot()">▶ INICIAR OPERAÇÃO AUTOMÁTICA</button>
                
                <div class="stats-grid">
                    <div class="stat-box"><small>STATUS</small><span id="botStatus">PAUSADO</span></div>
                    <div class="stat-box"><small>LUCRO</small><span id="botSession">$0.00</span></div>
                    <div class="stat-box"><small>W/L</small><span>0 / 0</span></div>
                </div>
            </aside>
        </div>
    </div>

    <script>
        let currentInterval = "1";
        let botActive = false;
        let analysisActive = false;

        function toggleMenu(e) { 
            e.stopPropagation();
            document.getElementById('sidebar').classList.toggle('open'); 
        }

        function closeMenuOnClickOutside(e) {
            const sidebar = document.getElementById('sidebar');
            if (sidebar.classList.contains('open')) {
                sidebar.classList.remove('open');
            }
        }

        function closeAllPanels() {
            document.querySelectorAll('.interface-panel').forEach(p => p.classList.remove('active'));
        }

        function switchTab(tabId) {
            // Regra 4: Fecha todas as outras abas/interfaces
            closeAllPanels();
            document.getElementById('panel-' + tabId).classList.add('active');
            document.getElementById('sidebar').classList.remove('open');
        }

        function toggleAnalysis(state) {
            analysisActive = state;
            document.getElementById('analysis-off').style.display = state ? 'none' : 'block';
            document.getElementById('analysis-on').style.display = state ? 'flex' : 'none';
            if(!state) {
                document.getElementById('iaAction').innerText = "ANALISANDO...";
                document.getElementById('iaProb').innerText = "--%";
            }
        }

        async function connectToServer() {
            const token = document.getElementById('tokenInput').value;
            if(!token) return;
            document.getElementById('status-msg').innerText = "Autenticando na Deriv...";

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({token: token})
                });
                const data = await res.json();
                if(data.status === 'success') {
                    document.getElementById('login-view').classList.remove('active');
                    document.getElementById('dashboard-view').classList.add('active');
                    loadChart(currentInterval);
                    startLiveData();
                } else {
                    document.getElementById('status-msg').innerText = "Erro: " + data.message;
                }
            } catch (e) {
                document.getElementById('status-msg').innerText = "Erro de conexão.";
            }
        }

        function loadChart(interval) {
            new TradingView.widget({
                "autosize": true,
                "symbol": "FOREXCOM:SPX500", 
                "interval": interval,
                "theme": "dark",
                "style": "1",
                "locale": "br",
                "container_id": "chart-container",
                "hide_side_toolbar": false,
                "allow_symbol_change": true,
            });
        }

        function toggleBot() {
            botActive = !botActive;
            const btn = document.getElementById('btnStartAuto');
            const status = document.getElementById('botStatus');
            if(botActive) {
                btn.innerText = "■ PARAR OPERAÇÃO";
                btn.style.background = "#ff3344";
                status.innerText = "OPERANDO";
                status.style.color = "var(--accent)";
            } else {
                btn.innerText = "▶ INICIAR OPERAÇÃO AUTOMÁTICA";
                btn.style.background = "var(--accent)";
                status.innerText = "PAUSADO";
                status.style.color = "white";
            }
        }

        function startLiveData() {
            setInterval(async () => {
                const res = await fetch('/account_info');
                const data = await res.json();
                document.getElementById('balance-display').innerText = "$" + (data.balance || 0).toFixed(2);
                document.getElementById('type-display').innerText = (data.account_type || "demo").toUpperCase();
            }, 3000);

            setInterval(async () => {
                if(!analysisActive) return;
                const res = await fetch('/get_analysis');
                const data = await res.json();
                if(data.status === 'active') {
                    const color = data.action.includes("CALL") ? "#00ff88" : "#ff3344";
                    const prob = (data.probability * 100).toFixed(0) + "%";
                    
                    document.getElementById('iaAction').innerText = data.action;
                    document.getElementById('iaAction').style.color = color;
                    document.getElementById('iaProb').innerText = prob;
                    document.getElementById('iaReason').innerText = data.reason;

                    document.getElementById('iaActionManual').innerText = "RECOMENDAÇÃO: " + data.action;
                    document.getElementById('iaActionManual').style.color = color;
                    document.getElementById('iaProbManual').innerText = "Probabilidade: " + prob;
                }
            }, 2000);
        }
    </script>
</body>
</html>
