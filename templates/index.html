<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Previus-Starps OS | Trading Bot</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://s3.tradingview.com/tv.js"></script>
</head>
<body class="dark-theme">
    <div class="sidebar" id="sidebar">
        <div class="logo">STARPS <span>OS</span></div>
        <nav>
            <a href="#">Dashboard</a>
            <a href="#">Estatísticas</a>
            <a href="#">Configurações</a>
        </nav>
    </div>

    <main class="content">
        <header>
            <div class="account-info">
                <span class="badge">Balance: <strong id="balance">$ 0.00</strong></span>
                <span class="badge type" id="account-type">Demo</span>
            </div>
        </header>

        <section class="grid">
            <div class="chart-container">
                <div id="tradingview_widget"></div>
            </div>

            <div class="analysis-card">
                <h3>Análise em Tempo Real</h3>
                <div id="signal-display">Aguardando sinal...</div>
                <div class="prob-bar"><div id="prob-fill"></div></div>
                <p id="reason"></p>
                <button id="btn-execute" class="btn-orange">Autorizar Entrada</button>
            </div>
        </section>
    </main>

    <script>
        // Inicializa TradingView para Volatility 100 (R_100)
        new TradingView.widget({
            "autosize": true,
            "symbol": "DERIV:R_100",
            "interval": "1",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "br",
            "container_id": "tradingview_widget"
        });

        async function updateData() {
            try {
                const response = await fetch('/get_analysis');
                const data = await response.json();
                document.getElementById('signal-display').innerText = data.action;
                document.getElementById('prob-fill').style.width = data.prob + '%';
                document.getElementById('reason').innerText = data.reason;
            } catch (e) { console.error("Erro ao buscar dados"); }
        }

        setInterval(updateData, 3000);
    </script>
</body>
</html>
