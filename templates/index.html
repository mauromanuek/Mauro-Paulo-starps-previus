<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Previus-Starps OS | Smart Interface</title>
    <link rel="stylesheet" href="/static/style.css">
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>
    <div id="login-view" class="view active">
        <div class="glass-card">
            <h1 class="logo-neon">STARPS <span>PREVIUS</span></h1>
            <p>SISTEMA DE INTELIGÊNCIA FINANCEIRA</p>
            <input type="password" id="tokenInput" placeholder="Token API Deriv">
            <button onclick="connect()" class="btn-glow">ACESSAR TERMINAL</button>
            <p id="status-msg"></p>
        </div>
    </div>

    <div id="dashboard-view" class="view">
        <header class="main-header">
            <button class="hamburguer" onclick="toggleMenu()">☰</button>
            <div class="user-info">
                <span id="balance" class="balance-text">$0.00</span>
                <span id="acc-type" class="account-badge">DEMO</span>
            </div>
        </header>

        <nav id="sidebar" class="sidebar-overlay">
            <div class="sidebar-content">
                <div class="sidebar-header">MENU DE OPERAÇÕES</div>
                <ul class="nav-links">
                    <li onclick="showScreen('analise')">📊 ANÁLISE GERAL</li>
                    <li onclick="showScreen('trade-rapido')">⚡ TRADE RÁPIDO</li>
                    <li onclick="showScreen('config')">⚙️ CONFIGURAÇÕES</li>
                    <li onclick="emergencyStop()" class="stop-link">🛑 STOP EMERGENCY</li>
                </ul>
            </div>
        </nav>

        <main class="app-container">
            <div class="chart-section">
                <div id="tradingview_widget"></div>
            </div>

            <div class="decision-panel">
                <div class="ia-intel">
                    <div class="intel-header">
                        <span class="status-dot"></span> IA REAL-TIME ANALYSIS
                        <span id="iaProb" class="prob-tag">--%</span>
                    </div>
                    <div id="iaReason" class="reason-text">Aguardando confluência de mercado para emitir sinal...</div>
                </div>

                <div class="action-grid">
                    <button id="btn-put" class="trade-btn put" onclick="confirmTrade('PUT')">
                        <span class="btn-label">PUT</span>
                        <span class="btn-sub">VENDA</span>
                    </button>
                    <button id="btn-call" class="trade-btn call" onclick="confirmTrade('CALL')">
                        <span class="btn-label">CALL</span>
                        <span class="btn-sub">COMPRA</span>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        let tvWidget = null;
        function toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); }

        async function connect() {
            const token = document.getElementById('tokenInput').value;
            const msg = document.getElementById('status-msg');
            msg.innerText = "Sincronizando APP 114910...";
            const res = await fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({token: token})
            });
            const data = await res.json();
            if(data.status === 'success') {
                document.getElementById('login-view').classList.remove('active');
                document.getElementById('dashboard-view').classList.add('active');
                initChart();
                startLoops();
            } else { msg.innerText = "Falha na Autenticação."; }
        }

        function initChart() {
            tvWidget = new TradingView.widget({
                "autosize": true,
                "symbol": "DERIV:VOL100",
                "interval": "1",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "br",
                "enable_publishing": false,
                "hide_top_toolbar": true,
                "hide_legend": true,
                "save_image": false,
                "container_id": "tradingview_widget"
            });
        }

        function startLoops() {
            setInterval(async () => {
                const r = await fetch('/account_info');
                const d = await r.json();
                document.getElementById('balance').innerText = "$" + (d.balance || 0).toFixed(2);
                document.getElementById('acc-type').innerText = (d.account_type || "demo").toUpperCase();
            }, 3000);

            setInterval(async () => {
                const r = await fetch('/get_analysis');
                const d = await r.json();
                if(d.status === 'active') {
                    const reasonEl = document.getElementById('iaReason');
                    const probEl = document.getElementById('iaProb');
                    reasonEl.innerText = d.reason;
                    probEl.innerText = (d.probability * 100).toFixed(0) + "%";
                    
                    // Feedback Visual de Intensidade
                    reasonEl.classList.add('pulse');
                    setTimeout(() => reasonEl.classList.remove('pulse'), 500);
                }
            }, 2000);
        }

        function emergencyStop() { location.reload(); }
    </script>
</body>
</html>
