<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Bot Deriv | Pro Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0b0e11; color: #eaecef; font-family: 'Inter', sans-serif; overflow: hidden; }
        .hidden-view { display: none !important; }
        .active-view { display: flex !important; flex-direction: column; height: 100%; }
        #chart-container { height: 45vh; width: 100%; border-bottom: 2px solid #1e2329; }
        @media (min-width: 1024px) { #chart-container { height: 60vh; } }
        .animate-fadeIn { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="h-screen flex flex-col">

    <div id="overlay" onclick="app.toggleMenu()" class="fixed inset-0 bg-black/60 z-30 hidden"></div>

    <div id="view-login" class="flex-1 flex items-center justify-center p-4">
        <div class="bg-[#1e2329] p-8 rounded-2xl border border-gray-800 w-full max-w-md shadow-2xl">
            <h1 class="text-2xl font-bold text-center mb-6">Master Bot <span class="text-yellow-500">Deriv</span></h1>
            <input type="password" id="api-token" placeholder="API TOKEN" class="w-full bg-black border border-gray-700 rounded-xl p-4 mb-4 text-center text-white">
            <button onclick="app.start()" class="w-full bg-yellow-500 text-black font-bold py-4 rounded-xl">CONECTAR</button>
        </div>
    </div>

    <div id="view-main" class="hidden-view h-screen flex flex-col">
        <header class="h-16 border-b border-gray-800 bg-[#1e2329] flex items-center justify-between px-6 z-50">
            <button onclick="app.toggleMenu()" class="text-yellow-500 text-2xl"><i class="fas fa-bars"></i></button>
            <div id="acc-balance" class="text-lg font-bold text-green-500 font-mono">$ 0.00</div>
        </header>

        <div id="side-menu" class="fixed left-0 top-0 h-full w-64 bg-[#1e2329] border-r border-gray-800 transform -translate-x-full transition-transform z-40 pt-20">
            <nav class="p-4 flex flex-col gap-2">
                <button onclick="app.switchInterface('general')" class="flex items-center gap-3 p-4 hover:bg-gray-800 rounded-xl text-left"><i class="fas fa-chart-pie text-blue-400"></i> Análise Geral</button>
                <button onclick="app.switchInterface('manual')" class="flex items-center gap-3 p-4 hover:bg-gray-800 rounded-xl text-left"><i class="fas fa-hand-pointer text-green-400"></i> Operação Manual</button>
                <button onclick="app.switchInterface('auto')" class="flex items-center gap-3 p-4 hover:bg-gray-800 rounded-xl text-left"><i class="fas fa-robot text-purple-400"></i> Automático</button>
                <button onclick="app.switchInterface('digits')" class="flex items-center gap-3 p-4 hover:bg-gray-800 rounded-xl text-left"><i class="fas fa-fingerprint text-yellow-400"></i> Digits</button>
            </nav>
        </div>

        <main class="flex-1 relative overflow-hidden">
            <div id="interface-general" class="hidden-view">
                <div id="chart-container"><div id="tv_widget" class="w-full h-full"></div></div>
                <div class="flex-1 p-6 flex flex-col items-center justify-center">
                    <div id="analysis-report" class="w-full max-w-lg bg-gray-900 border border-gray-800 rounded-3xl p-6 shadow-2xl">
                        <div id="report-content" class="text-center py-10 text-gray-600 font-bold uppercase tracking-widest">Aguardando Início da Análise...</div>
                        <button id="btn-gen-toggle" onclick="app.generateReport()" class="w-full py-4 bg-blue-600 rounded-2xl font-bold mt-4">INICIAR ANÁLISE TÉCNICA</button>
                    </div>
                </div>
            </div>

            <div id="interface-modules" class="hidden-view p-4 overflow-y-auto h-full bg-[#0b0e11]">
                <div id="module-render" class="max-w-md mx-auto"></div>
            </div>
        </main>
        
        <footer class="h-8 bg-black border-t border-gray-800 px-6 flex items-center justify-between text-[10px] text-gray-500 font-mono">
            <span id="footer-log">Sistema Ready</span>
            <div id="result-display"></div>
        </footer>
    </div>

    <script src="https://s3.tradingview.com/tv.js"></script>
    <script src="src/core/deriv_api.js"></script>
    <script src="src/components/auto_module.js"></script>
    <script src="src/components/manual_module.js"></script>
    <script src="src/components/digit_module.js"></script>

    <script>
        const app = {
            start() {
                const tok = document.getElementById('api-token').value;
                DerivAPI.connect(tok, (res) => {
                    if (res.msg_type === 'authorize' && !res.error) {
                        document.getElementById('view-login').classList.add('hidden-view');
                        document.getElementById('view-main').classList.remove('hidden-view');
                        document.getElementById('view-main').classList.add('active-view');
                        this.switchInterface('general');
                    }
                });
            },
            toggleMenu() {
                const m = document.getElementById('side-menu');
                const o = document.getElementById('overlay');
                const isOpen = m.style.transform === 'translateX(0px)';
                m.style.transform = isOpen ? 'translateX(-100%)' : 'translateX(0)';
                o.classList.toggle('hidden');
            },
            switchInterface(type) {
                const gen = document.getElementById('interface-general');
                const mods = document.getElementById('interface-modules');
                const render = document.getElementById('module-render');
                
                gen.classList.add('hidden-view');
                mods.classList.add('hidden-view');
                
                if (type === 'general') {
                    gen.classList.remove('hidden-view');
                    gen.classList.add('active-view');
                    new TradingView.widget({"autosize": true, "symbol": "BITSTAMP:BTCUSD", "theme": "dark", "container_id": "tv_widget"});
                } else {
                    mods.classList.remove('hidden-view');
                    if (type === 'manual') render.innerHTML = ManualModule.render();
                    if (type === 'auto') render.innerHTML = AutoModule.render();
                    if (type === 'digits') render.innerHTML = DigitModule.render();
                }
                this.toggleMenu();
            },
            generateReport() {
                const report = document.getElementById('report-content');
                report.innerHTML = `<div class="animate-pulse text-yellow-500">ESCANEANDO MERCADO...</div>`;
                setTimeout(() => {
                    report.innerHTML = `
                        <div class="text-left animate-fadeIn">
                            <p class="text-blue-500 text-[10px] font-bold uppercase">Tendência: <span class="text-white">ALTA FORTE</span></p>
                            <p class="text-yellow-500 text-[10px] font-bold uppercase mt-2">Estrutura: <span class="text-white">ROMPIMENTO DE TOPO</span></p>
                            <div class="mt-4 p-4 bg-green-900/20 border border-green-500 rounded-xl">
                                <p class="text-xs text-gray-300">Conclusão: O mercado apresenta tendência de alta com força moderada. Sugestão:</p>
                                <p class="text-3xl font-black text-green-500 mt-2">COMPRA AGRESSIVA</p>
                            </div>
                        </div>`;
                }, 3000);
            }
        };
    </script>
</body>
</html>
