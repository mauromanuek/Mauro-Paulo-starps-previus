<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Bot Deriv | Pro Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0b0e11; color: #eaecef; font-family: 'Inter', sans-serif; overflow: hidden; }
        .view-section { display: none; flex-direction: column; height: 100%; width: 100%; }
        .view-section.active { display: flex; }
        .indicator-glow { box-shadow: 0 0 20px #22c55e; border: 2px solid #22c55e !important; opacity: 1 !important; }
        .indicator-glow-red { box-shadow: 0 0 20px #ef4444; border: 2px solid #ef4444 !important; opacity: 1 !important; }
        #chart-container { height: 50vh; width: 100%; border-bottom: 2px solid #1e2329; }
        @media (min-width: 1024px) { #chart-container { height: 60vh; } }
        .log-win { color: #22c55e; font-weight: bold; }
        .log-loss { color: #ef4444; font-weight: bold; }
    </style>
</head>
<body class="h-screen flex flex-col" onclick="app.externalClick(event)">

    <div id="view-login" class="flex-1 flex items-center justify-center p-4">
        <div class="bg-[#1e2329] p-8 rounded-2xl border border-gray-800 w-full max-w-md shadow-2xl">
            <h1 class="text-2xl font-bold text-center mb-6 text-white">Master Bot <span class="text-yellow-500">Deriv</span></h1>
            <input type="password" id="api-token" placeholder="Insira seu API Token" class="w-full bg-black border border-gray-700 rounded-xl p-4 mb-4 text-center text-white outline-none">
            <button onclick="app.start()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-4 rounded-xl transition-all">CONECTAR TERMINAL</button>
        </div>
    </div>

    <div id="view-main" class="hidden h-screen flex flex-col">
        <header class="h-16 border-b border-gray-800 bg-[#1e2329] flex items-center justify-between px-6 z-50">
            <button id="menu-trigger" onclick="app.toggleMenu(event)" class="text-yellow-500 text-2xl"><i class="fas fa-bars"></i></button>
            <span class="font-bold text-yellow-500 italic uppercase">Pro Terminal</span>
            <div id="acc-balance" class="text-lg font-bold text-green-500 font-mono">$ 0.00</div>
        </header>

        <div id="side-menu" class="fixed left-0 top-16 h-full w-64 bg-[#1e2329] border-r border-gray-800 transform -translate-x-full transition-transform z-40 shadow-2xl">
            <nav class="p-4 flex flex-col gap-2">
                <button onclick="app.switchInterface('general')" class="flex items-center gap-3 p-4 hover:bg-gray-800 rounded-xl text-left transition-colors">
                    <i class="fas fa-home text-blue-400"></i> Análise Geral
                </button>
                <button onclick="app.switchInterface('manual')" class="flex items-center gap-3 p-4 hover:bg-gray-800 rounded-xl text-left transition-colors">
                    <i class="fas fa-hand-pointer text-green-400"></i> Operação Manual
                </button>
                <button onclick="app.switchInterface('auto')" class="flex items-center gap-3 p-4 hover:bg-gray-800 rounded-xl text-left transition-colors">
                    <i class="fas fa-robot text-purple-400"></i> Operação Automática
                </button>
                <button onclick="app.switchInterface('digits')" class="flex items-center gap-3 p-4 hover:bg-gray-800 rounded-xl text-left transition-colors">
                    <i class="fas fa-fingerprint text-yellow-400"></i> Digit Over / Under
                </button>
            </nav>
        </div>

        <main class="flex-1 relative overflow-hidden flex flex-col">
            <section id="interface-general" class="view-section active">
                <div id="chart-container">
                    <div id="tv_widget" class="w-full h-full"></div>
                </div>
                <div class="flex-1 flex flex-col items-center justify-center p-6 bg-[#0b0e11]">
                    <div id="analysis-report" class="w-full max-w-lg bg-gray-900 border border-gray-800 rounded-3xl p-8 text-center shadow-2xl">
                        <div id="report-content" class="text-4xl font-black text-gray-700 mb-6 uppercase">Aguardando Análise</div>
                        <button id="btn-gen-toggle" onclick="app.generateReport()" class="w-full py-4 bg-blue-600 rounded-2xl font-bold shadow-lg">INICIAR ANÁLISE</button>
                    </div>
                </div>
            </section>

            <section id="interface-manual" class="view-section p-4 overflow-y-auto bg-[#0b0e11]">
                <div id="manual-render"></div>
            </section>

            <section id="interface-auto" class="view-section p-4 overflow-y-auto bg-[#0b0e11]">
                <div id="auto-render"></div>
            </section>

            <section id="interface-digits" class="view-section p-4 overflow-y-auto bg-[#0b0e11]">
                <div id="digits-render"></div>
            </section>
        </main>
        
        <footer class="h-8 bg-black border-t border-gray-800 px-6 flex items-center justify-between text-[10px] text-gray-500 font-mono">
            <span id="status-text">Terminal Conectado</span>
            <div id="result-display" class="flex gap-4">
                </div>
        </footer>
    </div>

    <script src="https://s3.tradingview.com/tv.js"></script>
    <script src="src/core/deriv_api.js"></script>
    <script src="src/components/auto_module.js"></script>
    <script src="src/components/manual_module.js"></script>
    <script src="src/components/digit_module.js"></script>

    <script>
        const app = {
            isMenuOpen: false,
            isAnalyzing: false,
            // Estatísticas Globais Consolidadas
            stats: {
                profit: 0,
                loss: 0,
                totalContracts: 0,
                wins: 0,
                losses: 0
            },

            start() {
                const token = document.getElementById('api-token').value;
                if (!token) return alert("Insira o Token!");
                
                DerivAPI.connect(token, (res) => {
                    if (res.msg_type === 'authorize' && !res.error) {
                        document.getElementById('view-login').style.display = 'none';
                        document.getElementById('view-main').classList.remove('hidden');
                        this.switchInterface('general');
                        this.updateFooterUI();
                    }
                });
            },

            toggleMenu(e) {
                if(e) e.stopPropagation();
                this.isMenuOpen = !this.isMenuOpen;
                const menu = document.getElementById('side-menu');
                menu.style.transform = this.isMenuOpen ? 'translateX(0)' : 'translateX(-100%)';
            },

            externalClick(e) {
                const menu = document.getElementById('side-menu');
                const trigger = document.getElementById('menu-trigger');
                if (this.isMenuOpen && !menu.contains(e.target) && !trigger.contains(e.target)) {
                    this.toggleMenu();
                }
            },

            switchInterface(type) {
                document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
                const chartCont = document.getElementById('chart-container');
                
                if (type === 'general') {
                    chartCont.style.display = 'block';
                    this.initChart();
                } else {
                    chartCont.style.display = 'none';
                }

                const target = document.getElementById(`interface-${type}`);
                if (target) {
                    target.classList.add('active');
                    if (type === 'manual') document.getElementById('manual-render').innerHTML = ManualModule.render();
                    if (type === 'auto') document.getElementById('auto-render').innerHTML = AutoModule.render();
                    if (type === 'digits') document.getElementById('digits-render').innerHTML = DigitModule.render();
                }
                if (this.isMenuOpen) this.toggleMenu();
            },

            initChart() {
                new TradingView.widget({
                    "autosize": true, "symbol": "DERIV:R_100", "interval": "1",
                    "theme": "dark", "container_id": "tv_widget", "locale": "br"
                });
            },

            // CENTRAL DE RESULTADOS (Gatilhada pelo deriv_api.js)
            updateModuleProfit(val, prefix) {
                // 1. Atualiza Estatísticas do Rodapé Global
                this.stats.totalContracts++;
                if (val > 0) {
                    this.stats.profit += val;
                    this.stats.wins++;
                } else {
                    this.stats.loss += Math.abs(val);
                    this.stats.losses++;
                }
                this.updateFooterUI();

                // 2. Encaminha para o módulo específico processar seu ciclo de vida
                if (prefix === 'a' && typeof AutoModule.handleContractResult === 'function') {
                    AutoModule.handleContractResult(val);
                } else if (prefix === 'm' && typeof ManualModule.updateUI === 'function') {
                    // Nota: O ManualModule usa o evento 'contract_finished' internamente, 
                    // mas podemos reforçar a UI aqui se necessário.
                } else if (prefix === 'd' && typeof DigitModule.updateStatsUI === 'function') {
                    // Sincronia com Digit
                }
            },

            updateFooterUI() {
                const display = document.getElementById('result-display');
                if (!display) return;
                
                const totalNet = (this.stats.profit - this.stats.loss).toFixed(2);
                const colorClass = totalNet >= 0 ? 'text-green-500' : 'text-red-500';

                display.innerHTML = `
                    <span class="border-r border-gray-800 pr-2">LUCRO: <b class="text-green-500">$${this.stats.profit.toFixed(2)}</b></span>
                    <span class="border-r border-gray-800 pr-2">PERDA: <b class="text-red-500">$${this.stats.loss.toFixed(2)}</b></span>
                    <span class="border-r border-gray-800 pr-2">W: <b class="text-green-500">${this.stats.wins}</b> / L: <b class="text-red-500">${this.stats.losses}</b></span>
                    <span>NET: <b class="${colorClass}">$${totalNet}</b></span>
                `;
            },

            generateReport() {
                const btn = document.getElementById('btn-gen-toggle');
                const report = document.getElementById('report-content');
                this.isAnalyzing = !this.isAnalyzing;
                if (this.isAnalyzing) {
                    btn.innerText = "PARAR ANÁLISE";
                    btn.classList.replace('bg-blue-600', 'bg-red-600');
                    report.innerHTML = `<span class="animate-pulse text-yellow-500 text-2xl">ANALISANDO FLUXO R_100...</span>`;
                    this.analysisTimer = setTimeout(() => {
                        const sug = Math.random() > 0.5 ? "COMPRA FORTE" : "VENDA FORTE";
                        const col = sug.includes("COMPRA") ? "text-green-500" : "text-red-500";
                        report.innerHTML = `<div><p class="${col} text-3xl font-black">SUGESTÃO: ${sug}</p></div>`;
                    }, 3000);
                } else {
                    btn.innerText = "INICIAR ANÁLISE";
                    btn.classList.replace('bg-red-600', 'bg-blue-600');
                    report.innerText = "Aguardando Análise";
                    clearTimeout(this.analysisTimer);
                }
            }
        };
    </script>
</body>
</html>
