<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Bot Deriv | Pro Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0b0e11; color: #eaecef; font-family: 'Inter', sans-serif; overflow: hidden; }
        /* Fixação do Container do Gráfico - Regra 1 */
        #chart-container { 
            min-height: 400px; 
            height: 60vh; 
            width: 100%; 
            position: relative; 
            z-index: 10;
        }
        @media (min-width: 1024px) { #chart-container { height: 100%; min-height: 600px; } }
        
        .panel-active { display: block !important; }
        .btn-stop { background-color: #ef4444 !important; }
        .glow-green { box-shadow: 0 0 20px #22c55e; border: 2px solid #22c55e !important; animation: pulse 1.5s infinite; }
        .glow-red { box-shadow: 0 0 20px #ef4444; border: 2px solid #ef4444 !important; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
    </style>
</head>
<body class="h-screen flex flex-col">

    <div id="view-login" class="flex-1 flex items-center justify-center p-4">
        <div class="bg-[#1e2329] p-8 rounded-2xl border border-gray-800 w-full max-w-md shadow-2xl">
            <h1 class="text-2xl font-bold text-center mb-6">Master Bot <span class="text-yellow-500">Deriv</span></h1>
            <input type="password" id="api-token" placeholder="Insira seu API Token" class="w-full bg-black border border-gray-700 rounded-xl p-4 mb-4 text-center outline-none focus:border-yellow-500">
            <button onclick="app.login()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-4 rounded-xl transition-all">CONECTAR</button>
        </div>
    </div>

    <div id="view-main" class="hidden h-screen flex flex-col">
        <header class="h-16 border-b border-gray-800 bg-[#1e2329] flex items-center justify-between px-6 z-50">
            <div class="flex items-center gap-4">
                <button onclick="app.toggleMenu()" class="text-yellow-500 text-xl"><i class="fas fa-bars"></i></button>
                <span class="font-bold text-yellow-500 italic">PRO TERMINAL</span>
            </div>
            <div class="flex flex-col items-end">
                <span id="acc-balance" class="text-xl font-bold text-green-500">$ 0.00</span>
                <span id="acc-id" class="text-[10px] text-gray-500 font-mono">CR000000</span>
            </div>
        </header>

        <div id="side-menu" class="fixed left-0 top-16 h-full w-64 bg-[#1e2329] border-r border-gray-800 transform -translate-x-full transition-transform z-40">
            <nav class="p-4 flex flex-col gap-2">
                <button onclick="app.showPanel('general')" class="flex items-center gap-3 p-3 hover:bg-gray-800 rounded-lg text-left"><i class="fas fa-home text-blue-400"></i> Análise Geral</button>
                <button onclick="app.showPanel('manual')" class="flex items-center gap-3 p-3 hover:bg-gray-800 rounded-lg text-left"><i class="fas fa-hand-paper text-green-400"></i> Operação Manual</button>
                <button onclick="app.showPanel('auto')" class="flex items-center gap-3 p-3 hover:bg-gray-800 rounded-lg text-left"><i class="fas fa-robot text-purple-400"></i> Automatizada</button>
                <button onclick="app.showPanel('digits')" class="flex items-center gap-3 p-3 hover:bg-gray-800 rounded-lg text-left"><i class="fas fa-fingerprint text-yellow-400"></i> Digit Over/Under</button>
            </nav>
        </div>

        <main class="flex-1 flex flex-col lg:flex-row overflow-hidden">
            <div class="flex-[3] bg-black border-r border-gray-800" id="chart-container">
                <div id="tradingview_widget" class="w-full h-full"></div>
            </div>

            <div class="flex-[1.5] bg-[#0b0e11] p-4 overflow-y-auto" id="side-panel-container">
                
                <div id="panel-general" class="panel hidden panel-active">
                    <h2 class="text-xl font-bold text-blue-400 mb-4 uppercase italic">Visão Geral</h2>
                    <div class="grid grid-cols-2 gap-2 mb-4">
                        <div class="bg-gray-900 p-3 rounded">
                            <p class="text-[10px] text-gray-500 uppercase">Status</p>
                            <p id="gen-status" class="text-xs font-bold text-yellow-500">AGUARDANDO</p>
                        </div>
                        <div class="bg-gray-900 p-3 rounded">
                            <p class="text-[10px] text-gray-500 uppercase">Sinal</p>
                            <p id="gen-signal" class="text-xs font-bold text-gray-400">NENHUM</p>
                        </div>
                    </div>
                    <button id="btn-gen-start" onclick="app.toggleGeneralAnalysis()" class="w-full py-4 bg-green-600 rounded-xl font-bold shadow-lg">INICIAR ANÁLISE</button>
                    <div id="gen-log" class="mt-4 text-[10px] font-mono text-gray-500 h-40 overflow-y-auto bg-black p-2 rounded"></div>
                </div>

                <div id="panel-manual" class="panel hidden">
                    <h2 class="text-xl font-bold text-green-500 mb-4 uppercase italic">Manual</h2>
                    <div class="flex flex-col gap-4">
                        <div class="bg-gray-900 p-4 rounded-xl border border-gray-800">
                            <label class="text-[10px] text-gray-400 uppercase">Valor Entrada (USD)</label>
                            <input type="number" id="manual-stake" value="0.35" class="w-full bg-black border border-gray-700 p-2 rounded mt-1 text-white">
                        </div>
                        <button id="btn-man-analyze" onclick="app.toggleManualAnalysis()" class="w-full py-4 bg-blue-600 rounded-xl font-bold">INICIAR ANÁLISE</button>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <button id="btn-call" disabled onclick="app.executeTrade('CALL')" class="p-6 bg-gray-800 rounded-2xl border-2 border-transparent transition-all opacity-50">
                                <i class="fas fa-arrow-up text-2xl text-green-500"></i>
                                <p class="font-bold mt-2">COMPRAR</p>
                            </button>
                            <button id="btn-put" disabled onclick="app.executeTrade('PUT')" class="p-6 bg-gray-800 rounded-2xl border-2 border-transparent transition-all opacity-50">
                                <i class="fas fa-arrow-down text-2xl text-red-500"></i>
                                <p class="font-bold mt-2">VENDER</p>
                            </button>
                        </div>
                    </div>
                </div>

                <div id="panel-digits" class="panel hidden">
                    <h2 class="text-xl font-bold text-yellow-500 mb-4 uppercase italic">Digits O/U</h2>
                    <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 flex flex-col gap-3">
                        <select id="digit-type" class="bg-black border border-gray-700 p-2 rounded text-white text-sm">
                            <option value="OVER">DÍGITO ACIMA (OVER)</option>
                            <option value="UNDER">DÍGITO ABAIXO (UNDER)</option>
                        </select>
                        <input type="number" id="digit-prediction" value="2" class="bg-black border border-gray-700 p-2 rounded text-white text-sm" placeholder="Previsão (0-9)">
                        <button id="btn-digit-start" onclick="app.toggleDigitBot()" class="w-full py-4 bg-yellow-600 text-black font-bold rounded-xl mt-2">INICIAR ROBÔ</button>
                    </div>
                    <div id="digit-results" class="mt-4 space-y-2"></div>
                </div>

            </div>
        </main>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        const app = {
            token: '',
            chart: null,
            isMenuOpen: false,
            
            // Regra 1 e 2: Gráfico criado uma única vez
            initChart(symbol = "FOREXCOM:SPX500") {
                if (this.chart) return;
                this.chart = new TradingView.widget({
                    "autosize": true,
                    "symbol": symbol,
                    "interval": "1",
                    "timezone": "Etc/UTC",
                    "theme": "dark",
                    "style": "1",
                    "locale": "br",
                    "toolbar_bg": "#f1f3f6",
                    "enable_publishing": false,
                    "hide_side_toolbar": false,
                    "allow_symbol_change": true,
                    "container_id": "tradingview_widget"
                });
            },

            async login() {
                this.token = document.getElementById('api-token').value;
                if (!this.token) return alert("Insira o Token");
                
                // Chamada real ao backend (main.py)
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({token: this.token})
                });

                if (res.ok) {
                    document.getElementById('view-login').style.display = 'none';
                    document.getElementById('view-main').classList.remove('hidden');
                    this.initChart();
                    this.updateBalance();
                }
            },

            async updateBalance() {
                const res = await fetch(`/account_info?token=${this.token}`);
                const data = await res.json();
                if (data.balance) {
                    document.getElementById('acc-balance').innerText = `$ ${data.balance.toFixed(2)}`;
                    document.getElementById('acc-id').innerText = data.loginid;
                }
            },

            toggleMenu() {
                this.isMenuOpen = !this.isMenuOpen;
                document.getElementById('side-menu').style.transform = this.isMenuOpen ? 'translateX(0)' : 'translateX(-100%)';
            },

            showPanel(id) {
                document.querySelectorAll('.panel').forEach(p => p.classList.add('hidden'));
                document.getElementById(`panel-${id}`).classList.remove('hidden');
                if (this.isMenuOpen) this.toggleMenu();
            },

            // Regra 3 e 4: Botões e Lógica Manual
            isManualAnalyzing: false,
            toggleManualAnalysis() {
                const btn = document.getElementById('btn-man-analyze');
                this.isManualAnalyzing = !this.isManualAnalyzing;

                if (this.isManualAnalyzing) {
                    btn.innerText = "PARAR ANÁLISE";
                    btn.classList.add('btn-stop');
                    this.runManualAnalysis();
                } else {
                    btn.innerText = "INICIAR ANÁLISE";
                    btn.classList.remove('btn-stop');
                    this.resetManualButtons();
                }
            },

            async runManualAnalysis() {
                if (!this.isManualAnalyzing) return;
                
                // Simula análise real do backend
                const btnCall = document.getElementById('btn-call');
                const btnPut = document.getElementById('btn-put');
                
                app.notify("Analisando mercado...");
                
                // Chamada ao /get_analysis do FastAPI
                const res = await fetch(`/get_analysis?token=${this.token}`);
                const data = await res.json();

                if (this.isManualAnalyzing) {
                    this.resetManualButtons();
                    if (data.signal === 'CALL') {
                        btnCall.disabled = false;
                        btnCall.classList.add('glow-green');
                        btnCall.style.opacity = "1";
                    } else {
                        btnPut.disabled = false;
                        btnPut.classList.add('glow-red');
                        btnPut.style.opacity = "1";
                    }
                }
            },

            resetManualButtons() {
                ['btn-call', 'btn-put'].forEach(id => {
                    const b = document.getElementById(id);
                    b.disabled = true;
                    b.classList.remove('glow-green', 'glow-red');
                    b.style.opacity = "0.5";
                });
            },

            async executeTrade(type) {
                const stake = document.getElementById('manual-stake').value;
                app.notify(`Executando ordem ${type}...`);
                
                // Lógica de envio real para API Deriv (via Backend)
                const res = await fetch('/execute_trade', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        token: this.token,
                        type: type,
                        amount: stake
                    })
                });
                
                if (res.ok) {
                    app.notify("Contrato Aberto com Sucesso!");
                    this.updateBalance();
                }
            },

            notify(msg) {
                document.getElementById('status-text').innerText = `[LOG]: ${msg}`;
            }
        };
    </script>
</body>
</html>
