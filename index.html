<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Bot Deriv | Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0b0e11; color: #eaecef; font-family: 'Inter', sans-serif; overflow: hidden; }
        .glass { background: rgba(30, 35, 41, 0.95); backdrop-filter: blur(10px); }
        .active-btn { background-color: #ef4444 !important; } /* Cor para botão Parar/Desligar */
        /* Responsividade para manter gráfico e controles visíveis */
        @media (max-width: 768px) {
            .main-content { flex-direction: column; overflow-y: auto; }
            .chart-box { height: 300px; min-height: 300px; }
            .control-box { height: auto; }
        }
    </style>
</head>
<body class="h-screen flex flex-col">

    <div id="view-login" class="flex-1 flex items-center justify-center p-4">
        <div class="bg-[#1e2329] p-8 rounded-2xl border border-gray-800 w-full max-w-md shadow-2xl">
            <h1 class="text-2xl font-bold text-center mb-6">Master Bot <span class="text-yellow-500">Deriv</span></h1>
            <input type="password" id="api-token" placeholder="Insira seu API Token" 
                   class="w-full bg-black border border-gray-700 rounded-xl p-4 mb-4 text-center outline-none focus:border-yellow-500">
            <button onclick="app.start()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-4 rounded-xl transition-all">
                CONECTAR TERMINAL
            </button>
        </div>
    </div>

    <div id="view-main" class="hidden h-screen flex flex-col">
        <header class="h-16 border-b border-gray-800 glass flex items-center justify-between px-6 z-50">
            <div class="flex items-center gap-4">
                <button onclick="app.toggleMenu()" class="text-yellow-500 text-xl"><i class="fas fa-bars"></i></button>
                <span class="font-bold text-yellow-500 italic uppercase">Terminal de Operações</span>
            </div>
            <div id="acc-balance" class="text-xl font-bold text-green-500">$ 0.00</div>
        </header>

        <div id="side-menu" class="fixed left-0 top-16 h-full w-64 bg-[#1e2329] border-r border-gray-800 transform -translate-x-full transition-transform z-40 shadow-2xl">
            <nav class="p-4 flex flex-col gap-2">
                <button onclick="app.switchInterface('general')" class="flex items-center gap-3 p-3 hover:bg-gray-800 rounded-lg text-left border-b border-gray-800">
                    <i class="fas fa-home text-blue-400"></i> Análise Geral
                </button>
                <button onclick="app.switchInterface('digits')" class="flex items-center gap-3 p-3 hover:bg-gray-800 rounded-lg text-left">
                    <i class="fas fa-fingerprint text-yellow-400"></i> Digit Over/Under
                </button>
                <button onclick="app.switchInterface('manual')" class="flex items-center gap-3 p-3 hover:bg-gray-800 rounded-lg text-left">
                    <i class="fas fa-hand-paper text-green-400"></i> Operação Manual
                </button>
                <button onclick="app.switchInterface('auto')" class="flex items-center gap-3 p-3 hover:bg-gray-800 rounded-lg text-left border-t border-gray-800">
                    <i class="fas fa-robot text-purple-400"></i> Automatizada
                </button>
            </nav>
        </div>

        <main class="flex-1 flex main-content overflow-hidden p-2 gap-2">
            <div class="flex-[3] bg-black rounded-xl border border-gray-800 chart-box relative">
                <div id="tv_chart" class="w-full h-full"></div>
            </div>

            <div id="interface-container" class="flex-[2] bg-[#0b0e11] rounded-xl border border-gray-800 p-4 overflow-y-auto control-box shadow-inner">
                </div>
        </main>
        
        <div id="notification-bar" class="h-10 bg-black border-t border-gray-800 px-4 flex items-center text-xs italic text-gray-400">
            Aguardando comando...
        </div>
    </div>

    <script src="https://s3.tradingview.com/tv.js"></script>
    <script src="src/core/deriv_api.js"></script>
    <script src="src/components/digit_module.js"></script>
    <script src="src/components/manual_module.js"></script>
    <script src="src/components/auto_module.js"></script>

    <script>
        const app = {
            isMenuOpen: false,
            start() {
                const token = document.getElementById('api-token').value;
                if(!token) return;
                DerivAPI.connect(token, (data) => {
                    if(data.msg_type === 'authorize' && !data.error) {
                        document.getElementById('view-login').style.display = 'none';
                        document.getElementById('view-main').classList.remove('hidden');
                        this.switchInterface('general'); // Item 1: Inicia na Análise Geral
                    }
                    if(data.msg_type === 'balance') {
                        document.getElementById('acc-balance').innerText = `$ ${data.balance.balance.toFixed(2)}`;
                    }
                });
            },
            toggleMenu() {
                this.isMenuOpen = !this.isMenuOpen;
                document.getElementById('side-menu').style.transform = this.isMenuOpen ? 'translateX(0)' : 'translateX(-100%)';
            },
            switchInterface(type) {
                const container = document.getElementById('interface-container');
                container.innerHTML = ''; // Item 2: Fecha anterior completamente
                
                if(this.isMenuOpen) this.toggleMenu(); // Menu permanece, mas fecha a gaveta

                if(type === 'general') {
                    this.initChart("R_100");
                    container.innerHTML = `
                        <div class="flex flex-col gap-4">
                            <h2 class="text-xl font-bold text-blue-400 uppercase italic">Análise Geral</h2>
                            <div class="bg-gray-900 p-4 rounded-xl border border-gray-800">
                                <p class="text-sm text-gray-400 mb-4 text-center uppercase">Monitoramento de Mercado</p>
                                <button id="btn-gen-toggle" onclick="app.toggleGeneralAnalysis()" class="w-full py-4 bg-green-600 rounded-xl font-bold shadow-lg transition-all">INICIAR ANÁLISE</button>
                            </div>
                            <div id="general-log" class="text-[10px] text-gray-500 font-mono mt-4"></div>
                        </div>`;
                } else if(type === 'digits') {
                    this.initChart("R_100");
                    container.innerHTML = DigitModule.render();
                } else if(type === 'manual') {
                    this.initChart("R_100");
                    container.innerHTML = ManualModule.render();
                } else if(type === 'auto') {
                    this.initChart("R_100");
                    container.innerHTML = AutoModule.render();
                }
            },
            toggleGeneralAnalysis() {
                const btn = document.getElementById('btn-gen-toggle');
                const log = document.getElementById('general-log');
                if(btn.innerText === 'INICIAR ANÁLISE') {
                    btn.innerText = 'PARAR ANÁLISE / DESLIGAR';
                    btn.classList.add('active-btn');
                    log.innerHTML = "<p class='text-blue-500 animate-pulse'>[SISTEMA] Analisando ticks em tempo real...</p>";
                    this.notify("Analisando...");
                } else {
                    btn.innerText = 'INICIAR ANÁLISE';
                    btn.classList.remove('active-btn');
                    log.innerHTML = "";
                    this.notify("Operação interrompida.");
                }
            },
            notify(msg) {
                document.getElementById('notification-bar').innerText = `[LOG]: ${msg}`;
            },
            initChart(symbol) {
                new TradingView.widget({
                    "autosize": true,
                    "symbol": "DERIV:" + symbol, // Item 4: Símbolos válidos
                    "interval": "1",
                    "theme": "dark",
                    "style": "1",
                    "container_id": "tv_chart",
                    "locale": "br"
                });
            }
        };
    </script>
</body>
</html>
