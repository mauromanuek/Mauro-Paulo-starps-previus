<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Bot Deriv | Pro Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0b0e11; color: #eaecef; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 35, 41, 0.95); backdrop-filter: blur(10px); }
        .btn-active { background-color: #ef4444 !important; }
        .indicator-glow { box-shadow: 0 0 20px #22c55e; border: 2px solid #22c55e !important; }
        @media (max-width: 768px) {
            .layout-grid { flex-direction: column; overflow-y: auto; }
            .chart-area { height: 350px; min-height: 350px; }
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <div id="view-login" class="flex-1 flex items-center justify-center p-4">
        <div class="bg-[#1e2329] p-8 rounded-2xl border border-gray-800 w-full max-w-md">
            <h1 class="text-2xl font-bold text-center mb-6">Master Bot <span class="text-yellow-500">Deriv</span></h1>
            <input type="password" id="api-token" placeholder="Insira seu API Token" 
                   class="w-full bg-black border border-gray-700 rounded-xl p-4 mb-4 text-center outline-none focus:border-yellow-500">
            <button onclick="app.start()" class="w-full bg-yellow-500 text-black font-bold py-4 rounded-xl">CONECTAR</button>
        </div>
    </div>

    <div id="view-main" class="hidden h-screen flex flex-col">
        <header class="h-16 border-b border-gray-800 glass flex items-center justify-between px-6 z-50">
            <div class="flex items-center gap-4">
                <button onclick="app.toggleMenu()" class="text-yellow-500 text-xl"><i class="fas fa-bars"></i></button>
                <span class="font-bold text-yellow-500 italic uppercase">Pro Terminal</span>
            </div>
            <div id="acc-info" class="text-right">
                <span id="acc-type" class="text-[10px] block text-gray-400">REAL ACCOUNT</span>
                <span id="acc-balance" class="text-xl font-bold text-green-500">$ 0.00</span>
            </div>
        </header>

        <div id="side-menu" class="fixed left-0 top-16 h-full w-64 bg-[#1e2329] border-r border-gray-800 transform -translate-x-full transition-transform z-40">
            <nav class="p-4 flex flex-col gap-2">
                <button onclick="app.switchInterface('general')" class="flex items-center gap-3 p-3 hover:bg-gray-800 rounded-lg text-left">
                    <i class="fas fa-chart-pie text-blue-400"></i> Análise Geral
                </button>
                <button onclick="app.switchInterface('digits')" class="flex items-center gap-3 p-3 hover:bg-gray-800 rounded-lg text-left">
                    <i class="fas fa-fingerprint text-yellow-400"></i> Digit Over/Under
                </button>
                <button onclick="app.switchInterface('manual')" class="flex items-center gap-3 p-3 hover:bg-gray-800 rounded-lg text-left">
                    <i class="fas fa-hand-pointer text-green-400"></i> Operação Manual
                </button>
            </nav>
        </div>

        <main class="flex-1 flex layout-grid p-2 gap-2 overflow-hidden">
            <div class="flex-[3] bg-black rounded-xl border border-gray-800 chart-area">
                <div id="tv_chart" class="w-full h-full"></div>
            </div>

            <div id="interface-container" class="flex-[2] bg-[#0b0e11] rounded-xl border border-gray-800 p-4 overflow-y-auto">
                </div>
        </main>

        <div id="status-bar" class="h-8 bg-black border-t border-gray-800 px-4 flex items-center text-[10px] text-gray-500 italic">
            Sistema pronto.
        </div>
    </div>

    <script src="https://s3.tradingview.com/tv.js"></script>
    <script src="src/core/deriv_api.js"></script>
    <script src="src/components/digit_module.js"></script>
    <script src="src/components/manual_module.js"></script>

    <script>
        const app = {
            isMenuOpen: false,
            start() {
                const token = document.getElementById('api-token').value;
                DerivAPI.connect(token, (data) => {
                    if(data.msg_type === 'authorize') {
                        document.getElementById('view-login').style.display = 'none';
                        document.getElementById('view-main').classList.remove('hidden');
                        this.switchInterface('general'); // Item 3: Inicia na Geral
                    }
                    if(data.msg_type === 'balance') {
                        document.getElementById('acc-balance').innerText = `$ ${data.balance.balance.toFixed(2)}`;
                    }
                });
            },
            toggleMenu() {
                this.isMenuOpen = !this.isMenuOpen;
                document.getElementById('side-menu').style.transform = this.isMenuOpen ? 'translateX(0)' : 'translateX(-100%)';
            },
            // Item 2: Função de Mapeamento Deriv <-> TradingView
            mapSymbol(derivSymbol) {
                const map = { 'R_100': 'R_100', 'R_10': 'R_10', 'R_25': 'R_25', 'R_50': 'R_50', 'R_75': 'R_75' };
                return map[derivSymbol] || derivSymbol;
            },
            initChart(symbol) {
                new TradingView.widget({
                    "autosize": true, "symbol": "DERIV:" + this.mapSymbol(symbol),
                    "interval": "1", "theme": "dark", "container_id": "tv_chart", "locale": "br"
                });
            },
            switchInterface(type) {
                const container = document.getElementById('interface-container');
                container.innerHTML = '';
                if(type === 'general') {
                    this.initChart("R_100");
                    container.innerHTML = `
                        <div class="flex flex-col gap-4">
                            <h2 class="font-bold text-blue-400 uppercase">Análise Geral</h2>
                            <div class="grid grid-cols-3 gap-2">
                                <input id="inp-entry" type="number" placeholder="Entrada" class="bg-black p-2 rounded border border-gray-700 text-xs">
                                <input id="inp-tp" type="number" placeholder="Take Profit" class="bg-black p-2 rounded border border-gray-700 text-xs">
                                <input id="inp-sl" type="number" placeholder="Stop Loss" class="bg-black p-2 rounded border border-gray-700 text-xs">
                            </div>
                            <button id="btn-gen-toggle" onclick="app.toggleGen()" class="w-full py-4 bg-green-600 rounded-xl font-bold">INICIAR ANÁLISE</button>
                            <div id="gen-results" class="bg-black/40 p-4 rounded border border-gray-800 text-[10px] font-mono h-40 overflow-y-auto"></div>
                        </div>`;
                }
                if(type === 'digits') container.innerHTML = DigitModule.render();
                if(type === 'manual') container.innerHTML = ManualModule.render();
                if(this.isMenuOpen) this.toggleMenu();
            },
            toggleGen() {
                const btn = document.getElementById('btn-gen-toggle');
                if(btn.innerText.includes("INICIAR")) {
                    btn.innerText = "PARAR ANÁLISE / DESLIGAR";
                    btn.classList.add('btn-active');
                    this.notify("Iniciando análise automática...");
                } else {
                    btn.innerText = "INICIAR ANÁLISE";
                    btn.classList.remove('btn-active');
                }
            },
            notify(msg) { document.getElementById('status-bar').innerText = "[LOG]: " + msg; }
        };
    </script>
</body>
</html>
