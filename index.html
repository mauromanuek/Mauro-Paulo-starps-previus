<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Bot Deriv | Pro Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0b0e11; color: #eaecef; font-family: 'Inter', sans-serif; overflow: hidden; }
        .view-section { display: none; flex-direction: column; height: 100%; width: 100%; }
        .view-section.active { display: flex; }
        .indicator-glow { box-shadow: 0 0 20px #22c55e; border: 2px solid #22c55e !important; opacity: 1 !important; }
        .indicator-glow-red { box-shadow: 0 0 20px #ef4444; border: 2px solid #ef4444 !important; opacity: 1 !important; }
        #chart-container { height: 50vh; width: 100%; border-bottom: 2px solid #1e2329; }
        @media (min-width: 1024px) { #chart-container { height: 60vh; } }
    </style>
</head>
<body class="flex flex-col h-screen">
    <header class="flex items-center justify-between px-6 py-4 bg-[#161a1e] border-b border-[#1e2329]">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-yellow-500 rounded-lg flex items-center justify-center shadow-lg shadow-yellow-500/20">
                <i class="fas fa-robot text-black text-xl"></i>
            </div>
            <div>
                <h1 class="text-lg font-black tracking-tighter uppercase italic">Master<span class="text-yellow-500">Bot</span></h1>
                <p class="text-[10px] text-gray-500 font-bold leading-none">PRO TERMINAL v2.0</p>
            </div>
        </div>
        <div class="text-right">
            <p id="acc-balance" class="text-xl font-black text-green-500 tabular-nums">$ 0.00</p>
            <p class="text-[9px] text-gray-500 font-bold uppercase tracking-widest">Saldo em Tempo Real</p>
        </div>
    </header>

    <main class="flex-1 flex flex-col overflow-hidden">
        <div id="chart-container" class="bg-[#0b0e11] relative">
            <iframe src="https://tradingview.com/chart?symbol=DERIV:R_100" class="w-full h-full border-none"></iframe>
            <div class="absolute top-4 left-4 flex gap-2">
                <div class="bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/10 flex items-center gap-2">
                    <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                    <span class="text-[10px] font-bold">R_100 LIVE</span>
                </div>
            </div>
        </div>

        <nav class="flex bg-[#161a1e] border-y border-[#1e2329]">
            <button onclick="app.switchView('manual')" class="flex-1 py-4 text-[10px] font-black uppercase tracking-widest hover:text-yellow-500 transition-colors border-b-2 border-transparent" id="tab-manual">Manual</button>
            <button onclick="app.switchView('auto')" class="flex-1 py-4 text-[10px] font-black uppercase tracking-widest hover:text-yellow-500 transition-colors border-b-2 border-transparent" id="tab-auto">Automático</button>
            <button onclick="app.switchView('digits')" class="flex-1 py-4 text-[10px] font-black uppercase tracking-widest hover:text-yellow-500 transition-colors border-b-2 border-transparent" id="tab-digits">Dígitos</button>
            <button onclick="app.switchView('report')" class="flex-1 py-4 text-[10px] font-black uppercase tracking-widest hover:text-yellow-500 transition-colors border-b-2 border-transparent" id="tab-report">Análise</button>
        </nav>

        <section class="flex-1 overflow-y-auto p-6 bg-gradient-to-b from-[#0b0e11] to-[#161a1e]">
            <div id="view-manual" class="view-section"></div>
            <div id="view-auto" class="view-section"></div>
            <div id="view-digits" class="view-section"></div>
            <div id="view-report" class="view-section">
                <div class="max-w-md mx-auto space-y-4 text-center">
                    <h2 class="text-xl font-bold text-blue-500 italic uppercase">Scanner de Mercado</h2>
                    <div class="bg-gray-900 p-8 rounded-3xl border border-gray-800 shadow-2xl">
                        <div id="report-content" class="text-sm text-gray-400">Aguardando Início da Análise...</div>
                    </div>
                    <button id="btn-gen-toggle" onclick="app.generateReport()" class="w-full py-4 bg-blue-600 rounded-2xl font-black uppercase shadow-lg shadow-blue-500/20">Iniciar Análise IA</button>
                </div>
            </div>
        </section>
    </main>

    <footer class="p-4 bg-[#0b0e11] border-t border-[#1e2329]">
        <div id="auth-section" class="flex gap-2 max-w-md mx-auto">
            <input id="api-token" type="password" placeholder="Insira seu Token API Deriv" class="flex-1 bg-[#161a1e] border border-[#2b3139] rounded-xl px-4 py-3 text-xs focus:border-yellow-500 outline-none transition-all">
            <button onclick="app.initConnection()" class="bg-yellow-500 text-black px-6 py-3 rounded-xl font-black text-xs uppercase hover:bg-yellow-400 transition-all shadow-lg shadow-yellow-500/10">Conectar</button>
        </div>
    </footer>

    <script src="deriv_api.js"></script>
    <script src="manual_module.js"></script>
    <script src="auto_module.js"></script>
    <script src="digit_module.js"></script>

    <script>
        const app = {
            currentView: 'manual',
            profits: { m: 0, a: 0, d: 0 },
            isAnalyzing: false,

            init() {
                this.renderAll();
                this.switchView('manual');
            },

            renderAll() {
                document.getElementById('view-manual').innerHTML = ManualModule.render();
                document.getElementById('view-auto').innerHTML = AutoModule.render();
                document.getElementById('view-digits').innerHTML = DigitModule.render();
            },

            switchView(view) {
                document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
                document.getElementById(`view-${view}`).classList.add('active');
                
                document.querySelectorAll('nav button').forEach(b => {
                    b.classList.remove('text-yellow-500', 'border-yellow-500');
                    b.classList.add('text-gray-500', 'border-transparent');
                });
                
                const activeTab = document.getElementById(`tab-${view}`);
                activeTab.classList.replace('text-gray-500', 'text-yellow-500');
                activeTab.classList.replace('border-transparent', 'border-yellow-500');
                
                this.currentView = view;
            },

            initConnection() {
                const token = document.getElementById('api-token').value;
                if (!token) return alert("Por favor, insira o Token!");
                
                DerivAPI.connect(token, (data) => {
                    if (data.msg_type === 'authorize' && !data.error) {
                        document.getElementById('auth-section').innerHTML = `<div class="w-full text-center py-2 text-green-500 font-bold text-[10px] uppercase tracking-widest animate-pulse"><i class="fas fa-check-circle mr-2"></i> Conectado com Sucesso</div>`;
                    }
                });
            },

            updateModuleProfit(val, prefix) {
                this.profits[prefix] += val;
                const total = this.profits[prefix].toFixed(2);
                const el = document.getElementById(`${prefix}-val-profit`);
                
                if (el) {
                    el.innerText = `${total} USD`;
                    el.classList.remove('text-gray-600', 'text-green-500', 'text-red-500');
                    el.classList.add(this.profits[prefix] >= 0 ? 'text-green-500' : 'text-red-500');
                }
                
                this.checkRiskManagement(prefix);
            },

            checkRiskManagement(prefix) {
                const tp = parseFloat(document.getElementById(`${prefix}-tp`)?.value || 999999);
                const sl = parseFloat(document.getElementById(`${prefix}-sl`)?.value || 999999);
                const current = this.profits[prefix];

                if (current >= tp) {
                    alert(`🎯 TARGET PROFIT ALCANÇADO NO MÓDULO ${prefix.toUpperCase()}!`);
                    this.stopModule(prefix);
                } else if (current <= (sl * -1)) {
                    alert(`⚠️ STOP LOSS ATINGIDO NO MÓDULO ${prefix.toUpperCase()}!`);
                    this.stopModule(prefix);
                }
            },

            stopModule(prefix) {
                if (prefix === 'a' && AutoModule.isRunning) AutoModule.toggle();
                if (prefix === 'd' && DigitModule.isAnalysisRunning) DigitModule.analyze();
            },

            generateReport() {
                const btn = document.getElementById('btn-gen-toggle');
                const report = document.getElementById('report-content');
                this.isAnalyzing = !this.isAnalyzing;
                if (this.isAnalyzing) {
                    btn.innerText = "PARAR ANÁLISE";
                    btn.style.backgroundColor = "#ef4444";
                    report.innerHTML = `<span class="animate-pulse text-yellow-500 font-bold">ANALISANDO FLUXO DE MERCADO...</span>`;
                    this.analysisTimer = setTimeout(() => {
                        report.innerHTML = `<div class="text-left space-y-2"><p class="text-green-500 text-2xl font-black italic uppercase">Sugestão: Compra Forte</p><p class="text-[10px] text-gray-500 font-bold uppercase">Probabilidade de Acerto: 84%</p></div>`;
                    }, 3000);
                } else {
                    btn.innerText = "INICIAR ANÁLISE IA";
                    btn.style.backgroundColor = "#2563eb";
                    report.innerText = "Aguardando Análise";
                    clearTimeout(this.analysisTimer);
                }
            }
        };
        app.init();
    </script>
</body>
</html>
