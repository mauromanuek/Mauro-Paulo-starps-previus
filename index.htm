<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Bot Deriv | Pro Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --deriv-dark: #0b0e11; --deriv-card: #1e2329; --deriv-yellow: #f0b90b; }
        body { font-family: 'Inter', sans-serif; background-color: var(--deriv-dark); color: #eaecef; overflow: hidden; height: 100vh; }
        .glass { background: rgba(30, 35, 41, 0.95); backdrop-filter: blur(10px); }
        .sidebar-transition { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        #sidebar { left: -280px; }
        #sidebar.active { left: 0px; }
        .bg-card { background-color: var(--deriv-card); }
    </style>
</head>
<body>

    <div id="view-login" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-card w-full max-w-md p-8 rounded-2xl border border-gray-800 shadow-2xl glass">
            <div class="text-center mb-10">
                <h1 class="text-3xl font-bold">Master Bot <span class="text-yellow-500">Deriv</span></h1>
                <p class="text-gray-400 mt-2">App ID: 114910</p>
            </div>
            <div class="space-y-4">
                <input type="password" id="api-token" placeholder="Insira seu API Token" 
                       class="w-full bg-black/40 border border-gray-700 rounded-xl p-4 focus:border-yellow-500 outline-none text-center">
                <button onclick="app.start()" id="btn-connect" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-4 rounded-xl transition-all">
                    CONECTAR
                </button>
            </div>
        </div>
    </div>

    <div id="view-main" class="hidden h-screen flex flex-col">
        <header class="h-16 border-b border-gray-800 glass flex items-center justify-between px-6 z-50">
            <div class="flex items-center gap-4">
                <button onclick="ui.toggleMenu()" class="text-xl"><i class="fas fa-bars"></i></button>
                <span class="font-bold text-yellow-500">PRO TERMINAL</span>
            </div>
            <div class="flex gap-4 items-center">
                <div class="text-right">
                    <p id="acc-type" class="text-[10px] text-gray-500 uppercase">Conta</p>
                    <p id="acc-balance" class="text-lg font-bold text-green-500">$ 0.00</p>
                </div>
            </div>
        </header>

        <div class="flex flex-1 overflow-hidden relative">
            <aside id="sidebar" class="sidebar-transition absolute top-0 bottom-0 w-64 bg-card border-r border-gray-800 z-40 p-4">
                <nav class="mt-4 space-y-2">
                    <button onclick="ui.switchModule('digit')" class="w-full text-left p-4 rounded-xl hover:bg-gray-800 transition"><i class="fas fa-percentage mr-3"></i> Digits Over/Under</button>
                    <button onclick="ui.switchModule('manual')" class="w-full text-left p-4 rounded-xl hover:bg-gray-800 transition"><i class="fas fa-hand-pointer mr-3"></i> Operação Manual</button>
                    <button onclick="ui.switchModule('auto')" class="w-full text-left p-4 rounded-xl hover:bg-gray-800 transition"><i class="fas fa-robot mr-3"></i> Operação Automática</button>
                </nav>
            </aside>

            <main class="flex-1 flex flex-col p-4 gap-4 overflow-y-auto">
                <div class="h-[450px] bg-black rounded-2xl border border-gray-800 overflow-hidden shadow-2xl">
                    <div id="tv_chart" class="w-full h-full"></div>
                </div>

                <div id="interface-container" class="grid grid-cols-1 md:grid-cols-3 gap-4 min-h-[200px]">
                    <div class="col-span-3 text-center p-10 text-gray-500 italic">
                        Selecione um módulo no menu lateral para começar.
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="src/core/deriv_api.js"></script>
    <script src="src/components/digit_module.js"></script>
    <script src="src/components/manual_module.js"></script>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>

    <script>
        // Lógica de Inicialização e Controle de UI
        const app = {
            start() {
                const token = document.getElementById('api-token').value;
                if(!token) return alert("Insira o Token!");
                
                // Conecta usando o arquivo src/core/deriv_api.js
                DerivAPI.connect(token, (data) => {
                    if(data.msg_type === 'authorize' && !data.error) {
                        document.getElementById('view-login').classList.add('hidden');
                        document.getElementById('view-main').classList.remove('hidden');
                        this.initChart();
                    }
                    if(data.msg_type === 'balance') {
                        document.getElementById('acc-balance').innerText = `$ ${data.balance.balance}`;
                    }
                    if(data.msg_type === 'tick') {
                        // Avisa o módulo de Digits que chegou um novo número
                        const lastDigit = parseInt(data.tick.quote.toString().slice(-1));
                        if(typeof DigitModule !== 'undefined') DigitModule.updateStats(lastDigit);
                    }
                });
            },
            initChart() {
                new TradingView.widget({
                    "autosize": true, "symbol": "DERIV:R_100", "interval": "1",
                    "theme": "dark", "style": "1", "container_id": "tv_chart"
                });
            }
        };

        const ui = {
            toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); },
            switchModule(mod) {
                this.toggleMenu();
                const container = document.getElementById('interface-container');
                container.dataset.active = mod;
                
                if(mod === 'digit') container.innerHTML = DigitModule.render();
                if(mod === 'manual') container.innerHTML = ManualModule.render();
                if(mod === 'auto') container.innerHTML = '<div class="col-span-3 p-10 text-center">Módulo Automático em breve...</div>';
            }
        };
    </script>
</body>
</html>
